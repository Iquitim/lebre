[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lebre"
version = "0.1.0"
description = "Online one-step-ahead forecasting with statistically tested structural changes, within a small computational budget (implements LEBRE v0.52-r1)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Silvano Lima" }]
keywords = ["time series", "online forecasting", "anytime-valid inference", "e-process", "TinyML", "exogenous inputs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
"Research record" = "https://github.com/Iquitim/lebre-research"
"Research DOI" = "https://doi.org/10.5281/zenodo.23049103"

[tool.hatch.build.targets.sdist]
include = ["src/lebre", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
packages = ["src/lebre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
